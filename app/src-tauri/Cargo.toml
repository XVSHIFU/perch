[package]
name = "perch-desktop"
version = "1.0.0"
description = "Perch desktop manager for DSH and Pi workspaces"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sha2 = "=0.10.9"
semver = "=1.0.28"
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
rfd = "=0.15.4"
url = "2"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
tauri-plugin-single-instance = "2"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
serde_yaml_ng = "0.10"
httpdate = "=1.0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
